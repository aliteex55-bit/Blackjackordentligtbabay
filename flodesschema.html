* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, Arial, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .hint { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100% - 55px); }
#chart { padding: 12px 16px; overflow: auto; border-right: 1px solid var(--line); }
#chart svg { width: 100%; height: auto; display: block; font: 12px "Segoe UI", system-ui, Arial, sans-serif; }
#panel { padding: 16px 20px 40px; overflow: auto; }
.ln { stroke: var(--muted); stroke-width: 1.5; }
#arr path { fill: var(--muted); }
.lbl { fill: var(--muted); font-size: 11px; }
.node { cursor: pointer; }
.node rect { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; transition: fill .1s; }
.node text { fill: var(--text); pointer-events: none; }
.node:hover rect { stroke: var(--accent); stroke-width: 2.5; }
.k-pill rect, .k-bar rect, .k-note rect { fill: var(--panel); }
.k-note rect { stroke-dasharray: 5 4; }
.k-head rect { fill: var(--accent); stroke: var(--accent); }
.k-head text { fill: #ffffff; font-weight: 600; }
.node.sel rect { stroke: var(--accent); stroke-width: 4; fill: var(--accent-soft); }
.k-head.sel rect { fill: var(--accent); stroke: var(--text); }
.node.sel text { font-weight: 600; }
#panel h2 { font-size: 22px; margin: 0 0 6px; }
.say { background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 4px; margin: 10px 0 18px; font-size: 16px; }
.say b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.ref { margin: 0 0 26px; }
.ref h3 { font-size: 16px; margin: 0 0 2px; }
.ref .where { color: var(--muted); font-size: 13px; font-family: Consolas, "Cascadia Mono", monospace; }
.ref .what { margin: 6px 0 8px; }
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }
.code table { border-collapse: collapse; font: 13px/1.45 Consolas, "Cascadia Mono", "Courier New", monospace; min-width: 100%; }
.code td { padding: 0 10px; white-space: pre; vertical-align: top; }
.code td.n { color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--line); width: 1%; }
.code tr.hl td { background: var(--hl); }
.code tr.mark td.n { color: var(--accent); font-weight: 700; }
.t-kw { color: var(--c-kw); } .t-str { color: var(--c-str); } .t-com { color: var(--c-com); font-style: italic; }
.t-num { color: var(--c-num); }
ul.pts { list-style: none; margin: 8px 0 0; padding: 0; }
ul.pts li { display: flex; gap: 10px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
ul.pts li:hover, ul.pts li.on { background: var(--hl); }
ul.pts .ln-no { font-family: Consolas, monospace; color: var(--accent); font-weight: 700; min-width: 64px; }
.empty { color: var(--muted); font-size: 17px; margin-top: 40px; }
.nav { display: flex; gap: 8px; align-items: center; }
.pos { color: var(--muted); font-size: 13px; min-width: 60px; text-align: center; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  #chart { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>

[{"line":9,"text":"En renderare används för alla kort."}],"title":"Renderaren skapas en gång","to":9,"what":"Både lagringen och renderaren är fält i ConsoleUi och skapas när gränssnittet skapas."}],"say":"Tillvalet är genomfört med en egen klass som har ett tydligt ansvar: CardRenderer bygger bilden av ett kort som textrader och skriver aldrig själv till konsolen. ConsoleUi placerar raderna och sätter färgerna."}},"order":["start","load","count","names","newgame","h1","d1","d2","d3","d4","h2","p1","p2","p3","p4","h3","g1","g2","g3","g4","h4","j1","j2","j3","j4","h5","s1","s2","s3","s4","again","slut","tillval","t1","t2","t3","t4","input"]}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var panel = document.getElementById('panel');
  var current = -1;

  var KW = ('abstract as async await base bool break case catch char class const continue decimal default do double else enum false finally for foreach if in int is namespace new not null object or out override private protected public readonly record return sealed static string struct switch this throw true try using var void when while and').split(' ');

  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Splits the code into pieces: [class, text]. Used for the syntax colours.
  function tokens(code) {
    var out = [], i = 0, n = code.length;
    while (i < n) {
      var rest = code.slice(i), m;
      if (rest.slice(0, 2) === '//') {
        var nl = code.indexOf('\n', i); nl = nl < 0 ? n : nl;
        out.push(['t-com', code.slice(i, nl)]); i = nl; continue;
      }
      if ((m = /^\$?"(?:[^"\\\n]|\\.)*"/.exec(rest))) { out.push(['t-str', m[0]]); i += m[0].length; continue; }
      if ((m = /^'(?:[^'\\\n]|\\.)'/.exec(rest))) { out.push(['t-str', m[0]]); i += m[0].length; continue; }
      if ((m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(rest))) { out.push([KW.indexOf(m[0]) >= 0 ? 't-kw' : '', m[0]]); i += m[0].length; continue; }
      if ((m = /^[0-9][0-9_]*/.exec(rest))) { out.push(['t-num', m[0]]); i += m[0].length; continue; }
      out.push(['', code[i]]); i++;
    }
    return out;
  }

  // Turns the pieces into one HTML string per code line.
  function highlightLines(code) {
    var lines = [''], toks = tokens(code);
    toks.forEach(function (t) {
      var parts = t[1].split('\n');
      parts.forEach(function (p, k) {
        if (k > 0) lines.push('');
        if (p.length) lines[lines.length - 1] += t[0] ? '<span class="' + t[0] + '">' + esc(p) + '</span>' : esc(p);
      });
    });
    return lines;
  }

  // Shows the box that was clicked: heading, plain explanation, then each piece of
  // code with line numbers and the notes for single lines.
  function render(idx) {
    var id = DATA.order[idx], node = DATA.nodes[id];
    current = idx;
    document.querySelectorAll('.node.sel').forEach(function (e) { e.classList.remove('sel'); });
    var g = document.querySelector('.node[data-id="' + id + '"]');
    if (g) g.classList.add('sel');
    document.getElementById('pos').textContent = (idx + 1) + ' / ' + DATA.order.length;

    var h = '<h2>' + esc(node.name) + '</h2>';
    h += '<div class="say"><b>Enkelt förklarat</b>' + esc(node.say) + '</div>';
    node.refs.forEach(function (r, ri) {
      var marked = {};
      r.points.forEach(function (p) { marked[p.line] = true; });
      h += '<div class="ref" data-ref="' + ri + '"><h3>' + esc(r.title) + '</h3>';
      h += '<div class="where">' + esc(r.file) + ', rad ' + r.from + (r.to > r.from ? '&#8211;' + r.to : '') + '</div>';
      h += '<p class="what">' + esc(r.what) + '</p>';
      h += '<div class="code"><table>';
      highlightLines(r.code).forEach(function (ln, k) {
        var no = r.from + k;
        h += '<tr data-line="' + no + '"' + (marked[no] ? ' class="mark"' : '') + '><td class="n">' + no + '</td><td>' + (ln || ' ') + '</td></tr>';
      });
      h += '</table></div>';
      if (r.points.length) {
        h += '<ul class="pts">';
        r.points.forEach(function (p) {
          h += '<li data-line="' + p.line + '" tabindex="0"><span class="ln-no">Rad ' + p.line + '</span><span>' + esc(p.text) + '</span></li>';
        });
        h += '</ul>';
      }
      h += '</div>';
    });
    panel.innerHTML = h;
    panel.scrollTop = 0;
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  // Marks the code line that a note points at.
  function point(li) {
    var ref = li.closest('.ref'), line = li.getAttribute('data-line');
    ref.querySelectorAll('tr.hl').forEach(function (e) { e.classList.remove('hl'); });
    ref.querySelectorAll('li.on').forEach(function (e) { e.classList.remove('on'); });
    var tr = ref.querySelector('tr[data-line="' + line + '"]');
    if (tr) { tr.classList.add('hl'); tr.scrollIntoView({ block: 'nearest' }); }
    li.classList.add('on');
  }

  // Goes to the previous or next box (arrow keys and the buttons).
  function step(d) {
    var n = DATA.order.length;
    render(current < 0 ? 0 : (current + d + n) % n);
  }

  document.querySelectorAll('.node').forEach(function (g) {
    function go() { render(DATA.order.indexOf(g.getAttribute('data-id'))); }
    g.addEventListener('click', go);
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  panel.addEventListener('click', function (e) { var li = e.target.closest('ul.pts li'); if (li) point(li); });
  panel.addEventListener('mouseover', function (e) { var li = e.target.closest('ul.pts li'); if (li) point(li); });
  panel.addEventListener('keydown', function (e) { var li = e.target.closest('ul.pts li'); if (li && e.key === 'Enter') point(li); });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('.node, ul.pts li')) return;
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  document.getElementById('theme').addEventListener('click', function () {
    var root = document.documentElement, dark = root.getAttribute('data-theme');
    if (!dark) dark = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', dark === 'dark' ? 'light' : 'dark');
  });

  var start = DATA.order.indexOf(location.hash.slice(1));
  if (start >= 0) render(start);
})();
</script>
